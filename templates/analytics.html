<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ config['title'] }} | Live Intelligence Console</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', sans-serif; }
        
        /* 🌟 BRIGHT METRIC CARDS STYLE */
        .metric-card { background: #1e293b; border: 2px solid #334155; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); transition: 0.3s; }
        .metric-card:hover { border-color: #475569; transform: translateY(-3px); }
        
        /* 🌟 HIGH CONTRAST LABELS FOR CARD HEADINGS */
        .card-heading-label { color: #cbd5e1 !important; font-size: 0.95rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; display: block; }
        .value-display { font-size: 3.2rem; font-weight: 800; text-shadow: 0 2px 10px rgba(0,0,0,0.4); }
        
        .chart-card { background: #1e293b; border: 2px solid #334155; border-radius: 24px; padding: 25px; box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
        .chart-title-text { color: #f1f5f9 !important; font-weight: 700; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <span class="badge bg-{{ config['color'] }} px-3 py-2 rounded-pill fw-bold text-uppercase tracking-wider mb-2" style="font-size: 0.85rem;">
                <i class="fa-solid fa-chart-bar me-1"></i> Operations Analytics Panel
            </span>
            <h1 class="fw-bold m-0 text-white mt-1">{{ config['title'] }}</h1>
        </div>
        <a href="/" class="btn btn-light fw-bold rounded-pill px-4 py-2 border-0 shadow-sm"><i class="fa-solid fa-house me-1"></i> Main Hub</a>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-md-3">
            <div class="card metric-card p-4 text-center">
                <span class="card-heading-label">Total Footfall</span>
                <div class="value-display mt-2 text-info">{{ total }}</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card metric-card p-4 text-center">
                <span class="card-heading-label">Served Success</span>
                <div class="value-display mt-2 text-success">{{ served }}</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card metric-card p-4 text-center">
                <span class="card-heading-label">Active Waiting</span>
                <div class="value-display mt-2 text-warning">{{ waiting }}</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card metric-card p-4 text-center">
                <span class="card-heading-label">Avg Velocity</span>
                <div class="value-display mt-2 text-white">{{ avg_wait }} <span class="fs-4 fw-bold text-muted">mins</span></div>
            </div>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-md-6">
            <div class="card chart-card">
                <h4 class="fw-bold mb-4 chart-title-text"><i class="fa-solid fa-pie-chart me-2 text-info"></i>Service Load Shares</h4>
                <div style="position: relative; height:280px;">
                    <canvas id="serviceChart"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card chart-card">
                <h4 class="fw-bold mb-4 chart-title-text"><i class="fa-solid fa-line-chart me-2 text-success"></i>Peak Hours Distribution</h4>
                <div style="position: relative; height:280px;">
                    <canvas id="slotsChart"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Service Chart
    const ctxService = document.getElementById('serviceChart').getContext('2d');
    new Chart(ctxService, {
        type: 'doughnut',
        data: {
            labels: {{ service_labels|tojson }},
            datasets: [{
                data: {{ service_counts|tojson }},
                backgroundColor: ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'],
                borderWidth: 0
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#f1f5f9', font: { weight: 'bold', size: 12 } }, position: 'bottom' } }
        }
    });

    // Slots Chart
    const ctxSlots = document.getElementById('slotsChart').getContext('2d');
    new Chart(ctxSlots, {
        type: 'bar',
        data: {
            labels: {{ slots_labels|tojson }},
            datasets: [{
                label: 'Customers Booked',
                data: {{ slots_counts|tojson }},
                backgroundColor: 'rgba(59, 130, 246, 0.4)',
                borderColor: '#3b82f6',
                borderWidth: 2,
                borderRadius: 8
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { grid: { color: '#334155' }, ticks: { color: '#f1f5f9', font: { weight: 'bold' } } },
                x: { grid: { display: false }, ticks: { color: '#f1f5f9', font: { weight: 'bold' } } }
            },
            plugins: { legend: { display: false } }
        }
    });
</script>
</body>
</html>
