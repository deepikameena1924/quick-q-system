<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick-Q | Staff Authentication</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #1e293b; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', sans-serif; }
        .login-card { background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 100%; max-width: 400px; padding: 30px; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary"><i class="fa-solid fa-lock me-2 text-warning"></i>Staff Login</h2>
        <p class="text-muted small">Select your designated counter workstation</p>
    </div>

    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-danger p-2 small text-center" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/admin/login" method="POST">
        <div class="mb-3">
            <label class="form-label fw-bold text-secondary">Assign Counter</label>
            <select class="form-select p-3" name="counter" required>
                <option value="Counter 01">Counter 01 (General)</option>
                <option value="Counter 02">Counter 02 (Premium)</option>
                <option value="Counter 03">Counter 03 (Inquiry)</option>
            </select>
        </div>

        <div class="mb-4">
            <label class="form-label fw-bold text-secondary">Terminal Password</label>
            <input type="password" class="form-control p-3" name="password" placeholder="Enter station password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100 p-3 fw-bold fs-5 rounded-3">Access Terminal →</button>
    </form>
</div>

</body>
</html>
